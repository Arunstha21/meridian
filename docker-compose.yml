services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian}
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
    ports:
      # Bind to loopback to prevent exposing database port to public network
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: ["web"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-meridian}:${POSTGRES_PASSWORD:-meridian}@db:5432/${POSTGRES_DB:-meridian}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      SMTP_URL: ${SMTP_URL:-}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-meridian}:${POSTGRES_PASSWORD:-meridian}@db:5432/${POSTGRES_DB:-meridian}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      SMTP_URL: ${SMTP_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
