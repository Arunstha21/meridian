services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: ["web"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://meridian:meridian@db:5432/meridian
      APP_URL: http://localhost:3000
      NODE_ENV: production
      MAIL_TRANSPORT: console
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://meridian:meridian@db:5432/meridian
      APP_URL: http://localhost:3000
      NODE_ENV: production
      MAIL_TRANSPORT: console
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
